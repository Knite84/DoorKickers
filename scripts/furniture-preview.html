<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Martelli · furniture kit</title>
<style>
body{margin:0;background:#101a19;color:#e6e9df;font:15px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh}
header{position:absolute;top:18px;left:22px;max-width:560px;padding:16px;background:#142b24ed;z-index:2}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5;margin:6px 0}
button,select{padding:8px 11px;margin:0 6px 6px 0;background:#d8e7c9;color:#17251f;border:0;cursor:pointer;font:inherit}label{margin-right:8px}
#status{color:#ffc77d}footer{position:absolute;bottom:18px;left:22px;background:#142b24ed;padding:10px;z-index:2}
#labels{position:absolute;inset:0;pointer-events:none}.tag{position:absolute;transform:translate(-50%,-100%);font-size:11px;line-height:1.25;text-align:center;background:#0d1a17cc;padding:2px 5px;white-space:nowrap;border-radius:3px}.tag b{font-weight:600;color:#fff}.tag i{color:#9fd0ff;font-style:normal}
</style>
<header><h1>Furniture kit</h1><p>Every component and variant from <code>src/furniture.js</code>, drawn by the same code the game uses. Red frames are the single collision box each piece gets; blue labels are drawn only and never block.</p>
<label>Show <select id="mode"><option value="kit">Kit</option><option value="main">Martelli · Main</option><option value="foundation">Martelli · Foundation</option><option value="finishes">Finishes</option></select></label><label>Facing <select id="facing"><option>down</option><option>up</option><option>left</option><option>right</option></select></label><label>Focus <select id="focus"></select></label><br>
<button id="collision">Hide collision boxes</button><button id="labelsBtn">Hide labels</button><button id="overview">Overhead view</button>
<p id="status" role="status"></p></header>
<div id="labels"></div><canvas></canvas><footer>Drag to orbit, right-drag to pan, wheel to zoom. The grid is 1 m.</footer>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
import { furnitureKinds, piece, sectional, furnitureHeight, isDrawnOnly } from '/src/furniture.js';
import { furnitureMeshes } from '/src/furniture-mesh.js';
import { martelli } from '/src/maps/martelli.js';
import { surfaceKinds, surfaceTile } from '/src/surface-plan.js';
import { surfaceCanvas } from '/src/surface-textures.js';

const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x1b2a26);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.05,200),controls=new OrbitControls(camera,canvas);
scene.add(new THREE.HemisphereLight(0xfff4de,0x4a5a50,2.2));
const sun=new THREE.DirectionalLight(0xffedcd,2.6);sun.position.set(8,14,10);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});scene.add(sun,sun.target);
const materials={},material=color=>materials[color]??=new THREE.MeshStandardMaterial({color,roughness:.8});
const glass=new THREE.MeshStandardMaterial({color:0xbfe3ea,roughness:.1,transparent:true,opacity:.28,depthWrite:false});

// Every variant, plus L and U sectionals, as entries the map would use.
const items=[];
for(const [kind,k] of Object.entries(furnitureKinds))for(const variant of Object.keys(k.variants))items.push({name:`${k.label} · ${variant}`,kind,variant,size:k.variants[variant].size});
items.push({name:'Sectional · L',sectional:'L',size:[3.6,3.0]},{name:'Sectional · U',sectional:'U',size:[3.4,2.8]});
const rowWidth=16,gapX=.9,gapZ=1.6;let x=0,z=0,rowDepth=0;
for(const item of items){const [w,d]=item.size,span=Math.max(w,d);if(x+span>rowWidth){x=0;z+=rowDepth+gapZ;rowDepth=0;}item.at=[x+span/2,z+span/2];x+=span+gapX;rowDepth=Math.max(rowDepth,span);}
const offset=[rowWidth/2,(z+rowDepth)/2];items.forEach(i=>{i.at=[i.at[0]-offset[0],i.at[1]-offset[1]];});
const floor=new THREE.Mesh(new THREE.BoxGeometry(rowWidth+4,.1,z+rowDepth+4),material(0x4d5a52));floor.position.y=-.05;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(40,40,0x7f9384,0x5d6e62);grid.position.y=.002;scene.add(grid);

const groups=[],labels=document.querySelector('#labels'),collisionFrames=[];
function build(facing){
  for(const g of groups.splice(0))scene.remove(g);collisionFrames.length=0;labels.replaceChildren();
  for(const item of items){
    const group=new THREE.Group(),entries=item.sectional?sectional(item.sectional,item.at,{size:item.size,facing}):[piece(item.kind,item.variant,item.at,{facing})];
    for(const entry of entries){
      furnitureMeshes(entry,material,glass).forEach(m=>group.add(m));
      const h=furnitureHeight(entry);
      if(h>0){const frame=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(entry.size[0],h,entry.size[1])),new THREE.LineBasicMaterial({color:0xff5a4a}));frame.position.set(entry.position[0],h/2,entry.position[1]);group.add(frame);collisionFrames.push(frame);}
    }
    // Wall line behind the piece shows where its back goes.
    const first=entries[0],back={down:[0,-1],up:[0,1],left:[1,0],right:[-1,0]}[facing],[fw,fd]=item.sectional?(facing==='left'||facing==='right'?[item.size[1],item.size[0]]:item.size):first.size;
    const wall=new THREE.Mesh(new THREE.BoxGeometry(back[0]?.04:fw+.2,.06,back[1]?.04:fd+.2),material(0xd6c27a));wall.position.set(item.at[0]+back[0]*(fw/2+.05),.03,item.at[1]+back[1]*(fd/2+.05));group.add(wall);
    scene.add(group);groups.push(group);
    const tag=document.createElement('div'),drawnOnly=!item.sectional&&isDrawnOnly(item);
    const h=item.sectional?furnitureHeight(entries[0]):furnitureHeight(first);
    tag.className='tag';tag.innerHTML=`<b>${item.name}</b><br>${drawnOnly?'<i>drawn only</i> · ':''}${item.size[0]} × ${item.size[1]}${h?` × ${h}`:''} m`;
    labels.append(tag);item.tag=tag;item.top=new THREE.Vector3(item.at[0],Math.max(h||0,.4)+.35,item.at[1]);
  }
  setCollision(showCollision);
}
let showCollision=true,showLabels=true,facing='down';
function setCollision(on){showCollision=on;collisionFrames.forEach(f=>f.visible=on);document.querySelector('#collision').textContent=on?'Hide collision boxes':'Show collision boxes';}
document.querySelector('#collision').onclick=()=>setCollision(!showCollision);
document.querySelector('#labelsBtn').onclick=e=>{showLabels=!showLabels;labels.style.display=showLabels?'':'none';e.target.textContent=showLabels?'Hide labels':'Show labels';};
document.querySelector('#facing').onchange=e=>{facing=e.target.value;build(facing);};
const focus=document.querySelector('#focus');focus.replaceChildren(new Option('Whole kit',''),...items.map((i,n)=>new Option(i.name,String(n))));
function look(item){if(!item){controls.target.set(0,0,0);camera.position.set(0,15,17);}else{const span=Math.max(...item.size)+1.2;controls.target.set(item.at[0],.6,item.at[1]);camera.position.set(item.at[0]+span*.9,span*.9+.8,item.at[1]+span*1.3);}controls.update();}
focus.onchange=()=>look(items[Number(focus.value)]??(focus.value===''?null:null));
document.querySelector('#overview').onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,26,.01);controls.update();focus.value='';};
build(facing);look(null);
// Martelli mode: the map's walls (cut at 1.6 m so rooms read from above) and its placed furniture.
const house=new THREE.Group();house.visible=false;scene.add(house);let houseLevel=null;
function buildHouse(level){
  house.clear();const y0=level*3.2,wallMat=material(0xd9d3c4),extMat=material(0x9d978a),shown=[...martelli.props,...(martelli.decor??[])].filter(p=>Math.round((p.elevation??0)/3.2)===level);
  for(const w of martelli.walls){if(Math.round(w.elevation/3.2-.01)!==level&&!(w.elevation>y0&&w.elevation<y0+3.2))continue;const base=w.elevation-y0,h=Math.max(.05,Math.min(w.height??2.8,1.6-base));if(base>=1.6)continue;const m=new THREE.Mesh(new THREE.BoxGeometry(w.size[0],h,w.size[1]),w.exterior?extMat:wallMat);m.position.set(w.center[0],base+h/2,w.center[1]);m.castShadow=m.receiveShadow=true;house.add(m);}
  for(const d of martelli.doors.filter(d=>Math.round(d.elevation/3.2)===level)){const m=new THREE.Mesh(new THREE.BoxGeometry(...[d.size[0],.02,d.size[1]]),material(0x8a6a48));m.position.set(d.position[0],.01,d.position[1]);house.add(m);}
  for(const w of martelli.windows.filter(w=>Math.round(w.elevation/3.2)===level)){const m=new THREE.Mesh(new THREE.BoxGeometry(w.size[0],.03,Math.max(w.size[1],.1)),material(w.climbable===false?0xd06050:0x6fb6d0));m.position.set(w.position[0],.82,w.position[1]);house.add(m);}
  for(const p of shown){const flat={...p,elevation:(p.elevation??0)-y0};if(p.variant!==undefined||p.kind==='bed')furnitureMeshes(flat,material,glass).forEach(m=>house.add(m));else{const m=new THREE.Mesh(new THREE.BoxGeometry(p.size[0],p.height??1.1,p.size[1]),material(0x8a7a62));m.position.set(p.position[0],(p.height??1.1)/2,p.position[1]);house.add(m);}}
  for(const r of martelli.rooms.filter(r=>Math.round((r.elevation??0)/3.2)===level)){const tag=document.createElement('div');tag.className='tag';tag.innerHTML=`<b>${r.name}</b>`;labels.append(tag);roomTags.push({tag,top:new THREE.Vector3(r.center[0],1.8,r.center[1])});}
}
const roomTags=[];
// Finishes mode: each generated texture on a 2 m swatch at its real scale.
const swatches=new THREE.Group();swatches.visible=false;scene.add(swatches);
surfaceKinds.slice(1).forEach((kind,i)=>{
  const texture=new THREE.CanvasTexture(surfaceCanvas(kind));texture.colorSpace=THREE.SRGBColorSpace;texture.wrapS=texture.wrapT=THREE.RepeatWrapping;texture.repeat.set(2/surfaceTile[kind],2/surfaceTile[kind]);texture.anisotropy=4;
  const tint=kind==='paint'?0xe4ddcf:0xffffff,swatch=new THREE.Mesh(new THREE.BoxGeometry(2,.04,2),new THREE.MeshStandardMaterial({map:texture,color:tint,roughness:.85}));
  const x=(i%4)*2.6-3.9,z=Math.floor(i/4)*2.8-2.8;swatch.position.set(x,.02,z);swatch.receiveShadow=true;swatches.add(swatch);
  const tag=document.createElement('div');tag.className='tag';tag.innerHTML=`<b>${kind}</b><br>${surfaceTile[kind]} m repeat`;tag.style.display='none';labels.append(tag);roomTags.push({tag,top:new THREE.Vector3(x,.3,z+1.25),finish:true});
});
// Console helper: preview.view(x, z, height) frames a map point (metres).
window.preview={view:(x,z,h=7)=>{controls.target.set(x,0,z);camera.position.set(x,h,z+h*.55);controls.update();}};
document.querySelector('#mode').onchange=e=>{const mode=e.target.value,kit=mode==='kit';groups.forEach(g=>g.visible=kit);floor.visible=kit;
  for(const t of roomTags.filter(t=>!t.finish))t.tag.remove();roomTags.splice(0,roomTags.length,...roomTags.filter(t=>t.finish));items.forEach(i=>i.tag.style.visibility=kit?'':'hidden');
  const finishes=mode==='finishes';swatches.visible=finishes;roomTags.forEach(t=>{t.tag.style.visibility=t.finish&&!finishes?'hidden':'';});
  house.visible=!kit&&!finishes;if(finishes){controls.target.set(0,0,0);camera.position.set(0,7,6);controls.update();}else if(!kit){buildHouse(mode==='main'?1:0);controls.target.set(3,0,-3);camera.position.set(3,22,8);controls.update();}else look(null);};
document.querySelector('#status').textContent=`${items.length} pieces · ${Object.keys(furnitureKinds).length} components`;
const v=new THREE.Vector3();
function frame(){
  if(canvas.width!==Math.round(innerWidth*renderer.getPixelRatio())||canvas.height!==Math.round(innerHeight*renderer.getPixelRatio())){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
  controls.update();renderer.render(scene,camera);
  if(showLabels)for(const t of roomTags){v.copy(t.top).project(camera);const vis=v.z<1;t.tag.style.display=vis?'':'none';if(vis){t.tag.style.left=`${(v.x+1)/2*innerWidth}px`;t.tag.style.top=`${(1-v.y)/2*innerHeight}px`;}}
  if(showLabels)for(const item of items){v.copy(item.top).project(camera);const vis=v.z<1&&Math.abs(v.x)<1.1&&Math.abs(v.y)<1.1&&camera.position.distanceTo(item.top)<26;item.tag.style.display=vis?'':'none';if(vis){item.tag.style.left=`${(v.x+1)/2*innerWidth}px`;item.tag.style.top=`${(1-v.y)/2*innerHeight}px`;}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></html>
